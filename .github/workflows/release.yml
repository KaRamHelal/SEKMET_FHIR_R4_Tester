# Publishes to PyPI when a GitHub release is published, using PyPI Trusted Publishing (OIDC, no stored token).
# One-time setup on pypi.org: project sekmet-fhir -> Publishing -> add GitHub publisher
#   owner KaRamHelal, repo SEKMET_FHIR_R4_Tester, workflow release.yml, environment pypi
name: Release
on:
  release: {types: [published]}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
