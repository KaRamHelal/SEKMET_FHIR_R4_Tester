[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sekmet"
version = "0.1.0"
description = "SEKMET FHIR R4 Tester - a micro HIS for exercising real HIS FHIR R4 interfaces"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "fhir.resources>=8,<9",
  "fhirpathpy>=2.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "pyyaml>=6",
  "faker>=25",
  "jsonpatch>=1.33",
  "lxml>=5",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sekmet = "sekmet.cli:app"

[tool.setuptools.packages.find]
include = ["sekmet*"]

[tool.setuptools.package-data]
sekmet = ["ui/templates/*.html", "ui/templates/partials/*.html", "ui/static/*", "scenarios/library/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
