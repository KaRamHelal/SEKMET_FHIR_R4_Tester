[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sekmet-fhir"
version = "0.1.0"
description = "Micro hospital information system for testing HIS/EHR FHIR R4 integrations end to end: hospital workflows, lab/RIS/pharmacy/payer simulator, Subscriptions, Bulk Data, SMART, TestScript and load testing"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "SEKMET contributors"}]
keywords = ["fhir", "fhir-r4", "hl7", "hl7-fhir", "interoperability", "his", "ehr", "emr", "healthcare",
            "integration-testing", "test-harness", "mock-server", "simulator", "conformance", "testscript",
            "smart-on-fhir", "bulk-data", "subscriptions", "load-testing", "lis", "ris"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Testing :: Mocking",
  "Topic :: Software Development :: Testing :: Traffic Generation",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "fhir.resources>=8,<9",
  "fhirpathpy>=2.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "pyyaml>=6",
  "faker>=25",
  "jsonpatch>=1.33",
  "lxml>=5",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/KaRamHelal/SEKMET_FHIR_R4_Tester"
Documentation = "https://github.com/KaRamHelal/SEKMET_FHIR_R4_Tester/blob/main/docs/operations.md"
Issues = "https://github.com/KaRamHelal/SEKMET_FHIR_R4_Tester/issues"
Changelog = "https://github.com/KaRamHelal/SEKMET_FHIR_R4_Tester/blob/main/CHANGELOG.md"

[project.scripts]
sekmet = "sekmet.cli:app"

[tool.setuptools.packages.find]
include = ["sekmet*"]

[tool.setuptools.package-data]
sekmet = ["ui/templates/*.html", "ui/templates/partials/*.html", "ui/static/*", "scenarios/library/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
